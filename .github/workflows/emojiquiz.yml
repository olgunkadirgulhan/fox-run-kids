name: emojiquiz
# Guess the food Shorts (2026-11-08; emojiquiz.py QUIZ_KIND=food). CONTENT_MODE=food iken eski akışlar kapalı.
on:
  schedule:
    - cron: "27 13-22 * * *"
  workflow_dispatch:
    inputs:
      auto:
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: emojiquiz
  cancel-in-progress: false
jobs:
  make:
    if: (github.event_name != 'schedule' && !inputs.auto) || vars.CONTENT_MODE == 'food'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -q Pillow numpy requests google-api-python-client google-auth
      - env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PER_DAY: ${{ vars.QUIZ_PER_DAY || '3' }}
          QUIZ_KIND: food
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.auto }}" = "true" ]; then python emojiquiz.py --auto; else python emojiquiz.py --dry-run; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emojiquiz-${{ github.run_id }}
          path: out/foodquiz/*.mp4
          retention-days: 7
      - name: Kaydı sakla
        if: always()
        run: |
          git config user.name "quiz-bot"; git config user.email "bot@users.noreply.github.com"
          git add records/foodquiz_published.csv 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -qm "quiz: kayıt $(date -u +%F-%H%M)"
          for i in 1 2 3 4 5 6 7 8; do git pull --rebase -q && git push -q && break; sleep $((i*15)); done
