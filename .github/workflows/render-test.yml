name: render-test
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BLENDER_URL: https://download.blender.org/release/Blender4.5/blender-4.5.14-linux-x64.tar.xz
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install numpy pillow imageio-ffmpeg
      - name: System GL (Mesa software)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends xvfb libgl1 libegl1 libgl1-mesa-dri libxi6 libxrender1 libxkbcommon0 libsm6 libxxf86vm1 libxfixes3
      - uses: actions/cache@v4
        with:
          path: blender
          key: blender-4.5.14
      - name: Blender
        run: |
          if [ ! -x blender/blender ]; then mkdir -p blender && curl -sSL $BLENDER_URL | tar -xJ --strip-components=1 -C blender; fi
          blender/blender --version | head -1
          nproc; free -g
      - name: Simulate
        run: WARMUP_CFG=short1 python motion4.py
      - name: Render (Eevee, software GL)
        run: |
          export LIBGL_ALWAYS_SOFTWARE=1
          time xvfb-run -a -s "-screen 0 1920x1080x24" blender/blender -b -P bl_scene.py -- --out out --res 1080 --frames 95,96,300,301,600 --samples 16 2>&1 | grep -E "Error|Traceback|^Time|EEVEE|OpenGL|GPU" | head -40
        env:
          WARMUP_CFG: short1
      - uses: actions/upload-artifact@v5
        with:
          name: frames
          path: out/*.jpg
